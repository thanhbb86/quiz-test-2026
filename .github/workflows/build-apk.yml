name: Build Android APK (QUIZ TEST 2026)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17 (required for Capacitor 6 Android)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Build APK 1 - QUIZ TEST 2026 (TC B4)
        working-directory: "TC B4"
        run: |
          mkdir -p www
          cp index.html manifest.json www/
          cp -r data src www/
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK 1 (TC B4)
        uses: actions/upload-artifact@v4
        with:
          name: QUIZ-TEST-2026-TC-B4
          path: "TC B4/android/app/build/outputs/apk/debug/app-debug.apk"

      - name: Build APK 2 - QUIZ TEST 2026 (BHPP 2026)
        working-directory: "bhpp-2026"
        run: |
          mkdir -p www
          cp index.html manifest.json www/
          cp -r data src www/
          npm install
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK 2 (BHPP 2026)
        uses: actions/upload-artifact@v4
        with:
          name: QUIZ-TEST-2026-BHPP
          path: "bhpp-2026/android/app/build/outputs/apk/debug/app-debug.apk"
